spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:tc:mysql:8.0.36:///university_test_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: ${TEST_DB_DRIVER:org.testcontainers.jdbc.ContainerDatabaseDriver}
    username: ${TEST_DB_USERNAME:test}
    password: ${TEST_DB_PASSWORD:test}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 900000
      refresh-token:
        expiration: 604800000
  admin:
    bootstrap:
      enabled: false
      username:
      email:
      password:
      fullName:

logging:
  level:
    com.university.management: DEBUG
